@if (!esLogin) {
  <header class="header">
    <div class="container-fluid d-flex justify-content-between align-items-center py-2">
      <div class="btn-menu">
        <label for="btn-menu"><i class="fa-solid fa-bars"></i></label>
      </div>
      <div class="text-white">
        <h1 class="h5 m-0">GalacticAPP - Bienvenido, {{ nombreUsuario }}</h1>
      </div>
    </div>
  </header>

  <input type="checkbox" id="btn-menu">

  <div class="container-menu">
    <div class="cont-menu">

      <a routerLink="/dashboard" class="menu-brand" (click)="cerrarMenu()">
        <i class="fa-solid fa-cubes menu-brand__icon"></i>
        <span class="menu-brand__text"> GalacticAPP</span>
      </a>

      <nav>
        <a routerLink="/dashboard" routerLinkActive="activo" (click)="cerrarMenu()">
          <i class="fa-solid fa-house me-2"></i> Inicio
        </a>
        <a routerLink="/categorias" routerLinkActive="activo" (click)="cerrarMenu()">
          <i class="fa-solid fa-tags me-2"></i> Categorías
        </a>
        <a routerLink="/platos" routerLinkActive="activo" (click)="cerrarMenu()">
          <i class="fa-solid fa-utensils me-2"></i> Platos
        </a>
        <a routerLink="/menus" routerLinkActive="activo" (click)="cerrarMenu()">
          <i class="fa-solid fa-calendar-days me-2"></i> Menús
        </a>
        <a routerLink="/clientes" routerLinkActive="activo" (click)="cerrarMenu()">
          <i class="fa-solid fa-users me-2"></i> Clientes
        </a>
        <a routerLink="/pedidos" routerLinkActive="activo" (click)="cerrarMenu()">
          <i class="fa-solid fa-file-lines me-2"></i> Pedidos
        </a>
        <a routerLink="/zonas" routerLinkActive="activo" (click)="cerrarMenu()">
          <i class="fa-solid fa-map-location-dot me-2"></i> Zonas
        </a>
        <a href="#" class="menu-logout" (click)="$event.preventDefault(); cerrarSesion()">
          <i class="fa-solid fa-right-from-bracket me-2"></i> Cerrar sesión
        </a>


      </nav>

    </div>
  </div>

  <main>
      <router-outlet />
  </main>
} @else {
  <router-outlet />
}
